# One origin for the app and the API: one certificate to trust, no CORS, no mixed
# content and one port to forward — which is what makes a phone on the LAN work.

server {
  listen 80 default_server;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;

  root /usr/share/nginx/html;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location ^~ /api/ {
    proxy_pass http://backend:8000;
  }

  location ~* \.(js|css|woff2?|png|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Angular is a single-page app: every unknown path falls through to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
