# One origin for everything: the app, the API and Keycloak.
#
# That is what makes a phone work. crypto.subtle — which the PKCE login needs — is
# only exposed on a secure context, and http:// on a LAN address is not one. Serving
# over TLS fixes that, and putting all three behind a single origin means one
# certificate to trust, no CORS, no mixed content and one port to forward.

server {
  listen 80 default_server;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;

  root /usr/share/nginx/html;

  # Keycloak builds its issuer and redirect URLs from these, so they must say https
  # and carry the host the browser actually used.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Port  443;

  location ^~ /api/ {
    proxy_pass http://backend:8000;
  }

  # Keycloak's own paths: realm endpoints, login-page assets and the admin console.
  location ~ ^/(realms|resources|admin|js)/ {
    proxy_pass http://keycloak:8080;
  }

  location ~* \.(js|css|woff2?|png|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Angular is a single-page app: every unknown path falls through to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
