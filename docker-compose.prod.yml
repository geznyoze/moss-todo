# Production overlay for a public host. Layer it over the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Two things change: the frontend is served by Caddy with a real Let's Encrypt
# certificate instead of nginx with a self-signed one, and the token secret has to be
# a real one.
services:
  backend:
    environment:
      # No default on purpose. The development secret is public, in .env.example, and
      # anyone holding it can mint a token for any account.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — openssl rand -hex 32}
      CORS_ORIGINS: https://${PUBLIC_HOST}

  frontend:
    build:
      context: ./frontend
      target: caddy
    environment:
      # Caddy's site address. A hostname here means Caddy asks Let's Encrypt to
      # certify it, so it has to be a real name resolving to this machine — not an
      # IP. docker-compose.funnel.yml overrides it with :80 instead.
      SITE_ADDRESS: ${PUBLIC_HOST:?set PUBLIC_HOST to your domain in .env}
    volumes:
      # Issued certificates and the ACME account live here. Without it every restart
      # asks Let's Encrypt for a new certificate and eventually gets rate-limited.
      - caddy_data:/data

volumes:
  caddy_data:
