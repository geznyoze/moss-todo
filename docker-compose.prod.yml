# Production overlay for a public host. Layer it over the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Three things change: Keycloak leaves dev mode and pins its hostname, the frontend
# is served by Caddy with a real Let's Encrypt certificate instead of nginx with a
# self-signed one, and the realm comes from the file scripts/prep-realm.sh writes.
services:
  keycloak:
    # Production mode. Without --optimized, so the image runs its own build step on
    # first boot: ~30s once, against keeping a second Dockerfile in sync forever.
    command: ["start", "--import-realm"]
    environment:
      # One public hostname, so one issuer — the multi-issuer allowlist the base file
      # carries exists for LAN testing, where the browser reaches Keycloak by IP.
      KC_HOSTNAME: https://${PUBLIC_HOST}
      KC_HOSTNAME_STRICT: "true"
      # Caddy terminates TLS and forwards the real scheme in X-Forwarded-Proto.
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-moss.prod.json:/opt/keycloak/data/import/realm-moss.json:ro

  backend:
    environment:
      KEYCLOAK_ISSUERS: https://${PUBLIC_HOST}/realms/moss
      CORS_ORIGINS: https://${PUBLIC_HOST}

  frontend:
    build:
      context: ./frontend
      target: caddy
    environment:
      # Caddy's site address. A hostname here means Caddy asks Let's Encrypt to
      # certify it, so it has to be a real name resolving to this machine — not an
      # IP. docker-compose.funnel.yml overrides it with :80 instead.
      SITE_ADDRESS: ${PUBLIC_HOST:?set PUBLIC_HOST to your domain in .env}
    volumes:
      # Issued certificates and the ACME account live here. Without it every restart
      # asks Let's Encrypt for a new certificate and eventually gets rate-limited.
      - caddy_data:/data

volumes:
  caddy_data:
