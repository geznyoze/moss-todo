services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moss}
      POSTGRES_USER: ${POSTGRES_USER:-moss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moss}
    ports:
      # Loopback only. Published to the host, Postgres and the API would sit straight
      # on the internet of any machine with a public IP; everything the browser needs
      # goes through the proxy.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moss} -d ${POSTGRES_DB:-moss}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-moss}:${POSTGRES_PASSWORD:-moss}@db:5432/${POSTGRES_DB:-moss}
      # Signs and verifies our own tokens. The development default in .env.example is
      # fine on localhost; the prod overlay refuses to start without a real one.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret}
      # Same-origin through the proxy, so this only matters for direct API calls.
      CORS_ORIGINS: https://localhost,https://${PUBLIC_HOST:-localhost}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"  # loopback only, see db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      # nginx resolves its proxy_pass upstreams at startup, so the backend must exist first.
      backend:
        condition: service_started

volumes:
  db_data:
